# ---------------------------------------------------------------------------
# Reusable workflow: Python Test Suite
# ---------------------------------------------------------------------------
# This workflow is called by other workflows (e.g., tests.yml) to avoid
# duplicating the test steps.  It accepts a `python-version` input and
# runs linting, unit tests, and optional benchmarks.
# ---------------------------------------------------------------------------

name: "Reusable — Python Tests"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use (e.g. '3.10')"
        required: true
        type: string
      run-benchmark:
        description: "Whether to execute the benchmark job (true/false)"
        default: false
        required: false
        type: boolean

jobs:
  # -----------------------------------------------------------------------
  # Test job — runs on every matrix version
  # -----------------------------------------------------------------------
  test:
    name: "test (py${{ inputs.python-version }})"
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up the requested Python version
      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      # Step 3: Install the package with test dependencies
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      # Step 4: Run the main test suite
      - name: Run tests (core)
        run: pytest tests/

      # Step 5: Run the auto-daemon test suite
      - name: Run tests (auto-daemon)
        run: pytest auto-daemon/tests/

  # -----------------------------------------------------------------------
  # Benchmark job — only runs when explicitly requested (e.g. on main)
  # -----------------------------------------------------------------------
  benchmark:
    name: "benchmark (py${{ inputs.python-version }})"
    runs-on: ubuntu-latest
    if: ${{ inputs.run-benchmark }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install .[test]

      # Step: Run the built-in benchmark suite using a mock name
      - name: Run benchmarks
        run: python -m trinity bench --name mock

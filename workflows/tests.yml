# ---------------------------------------------------------------------------
# CI Workflow: Python Tests
# ---------------------------------------------------------------------------
# This workflow runs the full test suite across multiple Python versions
# on every push to main and on every pull request targeting main.
#
# Jobs:
#   - test (matrix: 3.10, 3.11, 3.12)  via the reusable workflow
#   - benchmark  (single run on main only)
# ---------------------------------------------------------------------------

name: "Python Tests"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same branch if a new commit is pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Test suite — matrix across three Python versions
  # -----------------------------------------------------------------------
  tests:
    name: "tests (py${{ matrix.python-version }})"
    strategy:
      fail-fast: false          # don't cancel other versions if one fails
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: ${{ matrix.python-version }}
      run-benchmark: false

  # -----------------------------------------------------------------------
  # Benchmark — runs once with Python 3.12 when pushing to main
  # -----------------------------------------------------------------------
  benchmark:
    name: "benchmark"
    needs: tests                # wait for the matrix tests to pass first
    # Only run on push events (not PRs) so we don't benchmark every PR commit
    if: github.event_name == 'push'

    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: "3.12"
      run-benchmark: true

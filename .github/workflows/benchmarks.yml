# Trinity Real Benchmark Workflow
# ================================
# 手动触发（workflow_dispatch）或每周日凌晨运行真实基准（latency + concurrency，
# 无需 API key），产物上传为 artifact，结果可与历史对比。
# 用法：GitHub → Actions → Trinity Real Benchmark → Run workflow

name: Trinity Real Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'   # 每周日 03:00 UTC

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "trinity-memory[api]" pytest
          python -m pip install psycopg2-binary sqlite-vec 2>/dev/null || true

      - name: Run latency benchmark
        run: |
          python benchmark/run_latency_bench.py --output-dir "$GITHUB_WORKSPACE/bench-results" || true
        working-directory: ${{ github.workspace }}

      - name: Run concurrency benchmark
        run: |
          python benchmark/concurrency_bench.py --output-dir "$GITHUB_WORKSPACE/bench-results" || true
        working-directory: ${{ github.workspace }}

      - name: Collect summary
        run: |
          ls -la bench-results/ || true
          find bench-results -name "*.md" -o -name "*.json" | head -20
        working-directory: ${{ github.workspace }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench-results/
          if-no-files-found: warn

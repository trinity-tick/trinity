name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" || true
          pip install -r requirements.txt 2>/dev/null || true
          pip install fastapi uvicorn pydantic numpy 2>/dev/null || true

      - name: Sub-package import check
        run: |
          python -c "
          import trinity
          print(f'trinity version: {trinity.__version__}')
          print('Sub-package import check PASSED')
          "

      - name: Basic self_test
        run: |
          python scripts/run_all_self_tests.py --target trinity 2>&1 | head -n 200

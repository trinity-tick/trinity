# ---------------------------------------------------------------------------
# Reusable workflow: Python Test Suite
# ---------------------------------------------------------------------------
# This workflow is called by other workflows (e.g., tests.yml) to avoid
# duplicating the test steps.  It accepts a `python-version` input and
# runs unit tests and optional benchmarks.
# ---------------------------------------------------------------------------

name: "Reusable — Python Tests"

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to use (e.g. '3.10')"
        required: true
        type: string
      run-benchmark:
        description: "Whether to execute the benchmark job (true/false)"
        default: false
        required: false
        type: boolean

jobs:
  # -----------------------------------------------------------------------
  # Test job — runs on every matrix version
  # -----------------------------------------------------------------------
  test:
    name: "test (py${{ inputs.python-version }})"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run tests (core)
        run: python -m pytest tests/ -v --tb=short

      - name: Run tests (auto-daemon)
        run: python -m pytest auto-daemon/tests/ -v --tb=short

  # -----------------------------------------------------------------------
  # Benchmark job — only runs when explicitly requested
  # -----------------------------------------------------------------------
  benchmark:
    name: "benchmark (py${{ inputs.python-version }})"
    runs-on: ubuntu-latest
    if: ${{ inputs.run-benchmark }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install package with test deps
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run benchmarks
        run: python -m trinity bench --name mock

# ---------------------------------------------------------------------------
# CI Workflow: Docker Build
# ---------------------------------------------------------------------------
# On every push to main (and tags matching v*) we build the Docker image.
# When a version tag is pushed we also push to Docker Hub.
#
# The image is tagged with:
#   - `latest`  for main-branch builds
#   - `vX.Y.Z`  for tag-triggered builds
# ---------------------------------------------------------------------------

name: "Docker Build"

on:
  push:
    branches: [main]
    tags:
      - "v*"                   # e.g. v1.2.3, v0.5.0-rc1

env:
  # -----------------------------------------------------------------------
  # Registry and image name — update DOCKERHUB_USERNAME to your
  # organisation or Docker Hub username.
  # -----------------------------------------------------------------------
  DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || 'trinity' }}
  IMAGE_NAME: trinity

jobs:
  docker:
    name: "Build & Push Docker Image"
    runs-on: ubuntu-latest

    # Permissions needed to read the repo and (optionally) push to GHCR
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx (provides multi-platform builds, caches)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Log in to Docker Hub (only when a tag is pushed)
      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Step 4: Determine Docker image tags
      #   - main branch  → trinity/trinity:latest
      #   - tag v1.2.3   → trinity/trinity:v1.2.3, trinity/trinity:latest
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      # Step 5: Build (and push if tag) the Docker image
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

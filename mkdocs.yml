site_name: Trinity Documentation
site_description: A persistent memory layer for AI agents with multi-modal, multi-tenant capabilities
site_author: Agentic AI Foundation
site_url: https://github.com/agentic-ai/trinity
repo_url: https://github.com/agentic-ai/trinity
repo_name: agentic-ai/trinity
edit_uri: blob/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  logo: https://raw.githubusercontent.com/agentic-ai/trinity/main/docs/assets/logo.png
  favicon: https://raw.githubusercontent.com/agentic-ai/trinity/main/docs/assets/favicon.png

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/agentic-ai/trinity
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/trinity-memory/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
  - tables
  - footnotes
  - def_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - API Reference: api-reference.md
  - Multi-Tenant: multi-tenant.md
  - Multimodal: multimodal.md
  - Deployment: deployment.md
  - Benchmarks: benchmarks.md
  - Contributing: contributing.md

copyright: Copyright &copy; 2025-2026 Agentic AI Foundation

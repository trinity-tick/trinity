[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-memory"
version = "8.2.1"
description = "Trinity v8.2.0: Memory Operating System — Multi-Agent Shared Memory, 50-Layer Guardian Chain, 129-Paper Brain-Inspired Alignment, GraphQL API, Raft Cluster, BM25+Jieba Chinese Retrieval"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trinity Team", email = "trinity-dev@trinity-tick.dev"}
]
keywords = [
    "long-term-memory",
    "agi",
    "memory-system",
    "rag",
    "llm",
    "mcp",
    "agent-memory",
    "beambench",
    "hindsight",
    "selfmem",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "jieba>=0.42.1",
]

# ── 2026-09（EXECUTION 108，依赖审计落地）──────────────
# 此前运行时硬依赖均未声明（仅存在于环境/uv.lock），全新环境无法安装。
# 按用途分组声明；版本约束取本机实测可用版本的下界。

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=5.0.0", "ruff>=0.1.0", "scikit-learn>=1.0.0", "Pillow>=10.0.0"]
sdk = ["requests>=2.28.0"]
mcp = ["mcp>=1.0.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.20.0", "strawberry-graphql>=0.224.0"]
# ── 2026-09 运行时依赖补全（依赖审计落地，EXECUTION 108）──
storage = [
    "psycopg2-binary>=2.9.0",
    "sqlite-vec>=0.1.6",
]
vector = [
    "faiss-cpu>=1.7.0",
    "onnxruntime>=1.17.0",
    "sentence-transformers>=2.2.0",
    "rank-bm25>=0.2.0",
    "scikit-learn>=1.0.0",
]
llm = [
    "ollama>=0.1.0",
    "requests>=2.28.0",
]
cache = ["redis>=4.0.0"]
benchmark = [
    "psutil>=5.0.0",
    "pyyaml>=6.0.0",
]
# 运行时全量（不强制 torch——CPU 环境可选；GPU 需自行装 torch 匹配版）
runtime = [
    "trinity-memory[storage,vector,llm,cache,benchmark]",
]
all = ["trinity-memory[sdk,mcp,api,storage,vector,llm,cache,benchmark]"]

[project.urls]
Homepage = "https://github.com/trinity-tick/trinity"
Repository = "https://github.com/trinity-tick/trinity.git"
Issues = "https://github.com/trinity-tick/trinity/issues"

[project.scripts]
trinity = "trinity.cli:main"
trinity-mcp = "trinity.mcp.server:main"
trinity-memory = "trinity.mcp.server:main"
trinity-api = "trinity.api.server:main"

[tool.setuptools.packages.find]
include = ["trinity*"]

[tool.setuptools.package-data]
"trinity" = ["py.typed", "api/static/*"]

[tool.pytest.ini_options]
# 与 pytest.ini 保持一致（pytest.ini 优先）；此前写 ["tests"] 造成 testpaths 二义性
testpaths = ["trinity/tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff.lint]
ignore = ["E401", "E402", "E701", "E702", "E712", "F401", "F402", "F541", "F811", "F821", "F841"]

[tool.coverage.run]
source = ["trinity"]
omit = ["tests/*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-memory"
version = "6.36.0"
description = "Trinity: A Triune Architecture for AGI Long-Term Memory — 122 modules, 50-tier guardian chain, 47 retrieval channels"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trinity Team", email = "trinity-dev@example.com"}
]
keywords = [
    "long-term-memory",
    "agi",
    "memory-system",
    "retrieval-augmented-generation",
    "llm",
    "mcp",
    "agent-memory",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]
mcp = [
    "mcp>=1.0.0",
]
postgres = [
    "psycopg2-binary>=2.9.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]
langchain = [
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
]
all = [
    "trinity-memory[dev,test,mcp,postgres,api,langchain]",
]

[project.urls]
Homepage = "https://github.com/trinity-memory/trinity"
Documentation = "https://github.com/trinity-memory/trinity/tree/main/docs"
Repository = "https://github.com/trinity-memory/trinity.git"
Issues = "https://github.com/trinity-memory/trinity/issues"

[project.scripts]
trinity = "trinity.__main__:main"
trinity-api = "trinity.api.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["trinity*"]

[tool.setuptools.package-data]
"trinity" = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["trinity"]
omit = ["tests/*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trinity-memory"
version = "6.37.0"
description = "Trinity: A Triune Architecture for AGI Long-Term Memory — 122 modules, 50-tier guardian chain, 47 retrieval channels"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trinity Team", email = "trinity-dev@trinity-tick.dev"}
]
keywords = [
    "long-term-memory",
    "agi",
    "memory-system",
    "rag",
    "llm",
    "mcp",
    "agent-memory",
    "beambench",
    "hindsight",
    "selfmem",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-cov>=5.0.0", "ruff>=0.1.0", "scikit-learn>=1.0.0", "Pillow>=10.0.0"]
mcp = ["mcp>=1.0.0"]
api = ["fastapi>=0.100.0", "uvicorn>=0.20.0"]
all = ["trinity-memory[mcp,api]"]

[project.urls]
Homepage = "https://github.com/trinity-tick/trinity"
Repository = "https://github.com/trinity-tick/trinity.git"
Issues = "https://github.com/trinity-tick/trinity/issues"

[project.scripts]
trinity = "trinity.cli:main"
trinity-mcp = "trinity.mcp.server:main"
trinity-api = "trinity.api.server:main"

[tool.setuptools.packages.find]
include = ["trinity*"]

[tool.setuptools.package-data]
"trinity" = ["py.typed", "api/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.ruff.lint]
ignore = ["E401", "E402", "E701", "E702", "E712", "F401", "F402", "F541", "F811", "F821", "F841"]

[tool.coverage.run]
source = ["trinity"]
omit = ["tests/*"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-daemon"
version = "1.0.0"
description = "50-tier Guardian Chain for LLM Runtime Safety — input filtering, behavior analysis, execution isolation, audit & provenance, reasoning drift detection"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Trinity Team", email = "trinity-dev@example.com"}
]
keywords = [
    "llm-safety",
    "guardrails",
    "ai-security",
    "memory-guard",
    "runtime-safety",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
]

[project.optional-dependencies]
langchain = [
    "langchain>=0.1.0",
]
openai = [
    "openai>=1.0.0",
]
fastapi = [
    "fastapi>=0.100.0",
]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.4.0",
]
all = [
    "auto-daemon[langchain,openai,fastapi,dev]",
]

[project.urls]
Homepage = "https://github.com/trinity-memory/auto-daemon"
Repository = "https://github.com/trinity-memory/auto-daemon.git"

[project.scripts]
auto-daemon = "auto_daemon.cli:main"

[tool.setuptools.packages.find]
include = ["auto_daemon*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
